name: Build Native Deku Anime iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-13
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd ios-app
          xcodegen generate

      - name: Build and Package IPA
        run: |
          cd ios-app
          mkdir -p build/Payload
          
          echo "Archiving DekuAnime with Xcode..."
          xcodebuild archive \
            -project DekuAnime.xcodeproj \
            -scheme DekuAnime \
            -configuration Release \
            -archivePath build/DekuAnime.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          echo "Packaging Payload..."
          cp -R build/DekuAnime.xcarchive/Products/Applications/DekuAnime.app build/Payload/
          cd build
          zip -qr DekuAnime.ipa Payload
          echo "DekuAnime.ipa created successfully!"

      - name: Upload DekuAnime IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DekuAnime-iOS-IPA
          path: ios-app/build/DekuAnime.ipa
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Deku Anime Native iOS v1.0.0"
          body: "Offizieller nativer iOS SwiftUI Build für Deku Anime. Bereit für Sideloadly / SideStore."
          files: ios-app/build/DekuAnime.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
