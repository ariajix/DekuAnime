name: Build iOS IPA (Deku Anime)

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios-app/**'

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobansky/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Create Xcode Project via Swift Package or Xcodebuild
        run: |
          cd ios-app
          mkdir -p build
          echo "Building Deku Anime for iOS Device (arm64)..."
          # Ad-hoc / Sideload IPA Build
          xcodebuild -workspace *.xcworkspace -scheme DekuAnime \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/DekuAnime.xcarchive archive \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO || true

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DekuAnime_iOS_App
          path: ios-app/

